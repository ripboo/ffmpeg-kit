name: android build scripts

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - main
    paths:
      - '.github/workflows/android-build-scripts.yml'
      - 'android/**'
      - '!android/README.md'
      - 'scripts/**'
      - 'tools/**'
      - 'android.sh'
  pull_request:
    branches:
      - development
      - main
    paths:
      - '.github/workflows/android-build-scripts.yml'
      - 'android/**'
      - '!android/README.md'
      - 'scripts/**'
      - 'tools/**'
      - 'android.sh'

jobs:
  build-main-on-linux:
    name: android arm64-v8a on linux (ndk-r25b)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: set up adopt jdk 17
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm build-essential ninja-build cmake pkg-config autoconf automake libtool doxygen swig groovy
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --uninstall "cmake;3.10.2.4988404" "cmake;3.18.1"
      
      - name: remove pre-installed ndk
        run: rm -rf /usr/local/lib/android/sdk/ndk/27*

      - name: set up android ndk r25b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          link-to-sdk: true

      - name: run the build script (arm64-v8a + x264 + x265)
        run: |
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export APP_ALLOW_MISSING_DEPS=true
          ./android.sh -d --enable-gpl --enable-x264 --enable-x265 --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64

      - name: prepare and upload main aar
        run: |
          AAR_PATH=$(find prebuilt -type f -name 'ffmpeg-kit.aar')
          if [ -z "$AAR_PATH" ]; then
            echo "Error: ffmpeg-kit.aar not found in prebuilt directory."
            exit 1
          fi
          mv "$AAR_PATH" "ffmpeg-kit-arm64-v8a-ndk-r25.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-arm64-v8a-aar
          path: ffmpeg-kit-arm64-v8a-ndk-r25.aar
          if-no-files-found: error

      - name: print full build logs on failure
        if: ${{ failure() }}
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          test -f build.log && tail -n 100 build.log || echo "No build.log file found"
          echo "=== TAIL OF FFMPEG KIT BUILD LOG ==="
          test -f ./android/build.log && tail -n 100 ./android/build.log || true

  create-release:
    name: create github release
    needs: [build-main-on-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: set release tag
        id: set_tag
        run: echo "TAG_NAME=ffmpeg-kit-arm64-v8a-$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_ENV
      - name: download all aar artifacts
        uses: actions/download-artifact@v4
        with:
          path: aar-artifacts
      - name: list downloaded files for debug
        run: ls -R aar-artifacts
      - name: create github release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Android ARM64-v8a AAR (NDK r25b) - ${{ env.TAG_NAME }}"
          body: "Automated release of Android AAR file built exclusively for arm64-v8a architecture with x264 and x265 support."
          prerelease: true
          files: aar-artifacts/*/*.aar
